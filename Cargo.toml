[package]
name = "cce-designer"
version = "0.1.0"
edition = "2021"

[dependencies]
cce-ui = { path = "../cce-ui" }
smithay-client-toolkit = "0.19.2"
calloop = "0.13.0"
calloop-wayland-source = "0.3.0"
wayland-client = { version = "0.31", features = ["system"] }
xkeysym = "0.2"
raw-window-handle = "0.6"
bytemuck = { version = "1", features = ["derive"] }
# glyphon supplies cosmic-text/swash (shaping + rasterization) for the ash text
# stage; its wgpu renderer half is unused since the VkRenderer cutover.
glyphon = "0.8"
tokio = { version = "1", features = ["full"] }
glam = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
opencl3 = "0.9"
libc = "0.2"
log = "0.4"
env_logger = "0.11"
png = "0.17"

[[bin]]
name = "cce-designer"
path = "src/main.rs"

# Standalone smoke test for the ash renderer (opens its own window; does not
# touch the main app). Run inside a Wayland session:
#   cargo run -p cce-designer --bin vk-smoke
[[bin]]
name = "vk-smoke"
path = "src/vk_smoke.rs"



