[package]
name = "cce-designer"
version = "0.1.0"
edition = "2021"

[dependencies]
cce-ui = { git = "https://github.com/lsgalante/cce-ui.git", rev = "327a952730d08dd93a97b965b3105a428b896c3b", features = ["graph", "3d"] }
smithay-client-toolkit = "0.19.2"
calloop = "0.13.0"
calloop-wayland-source = "0.3.0"
wayland-client = { version = "0.31", features = ["system"] }
xkeysym = "0.2"
bytemuck = { version = "1", features = ["derive"] }
# Only the vk-smoke bin shapes text directly now — the app's text goes through
# the engine's display-list pass (display_list_text) since the paint migration.
glam = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
log = "0.4"
env_logger = "0.11"
png = "0.17"
rhai = "1"

[lints.clippy]
# The toolkit's house style (cce-ui's [lints.clippy]):
# - geometry and paint functions take their inputs piecewise;
too_many_arguments = "allow"
# - the tuple views (`(u32, u32, u32, u32)` rects, `([f32; 3], u32)` lists, …);
type_complexity = "allow"
# - geometry loops index a mesh's points and parallel arrays in step.
needless_range_loop = "allow"

[[bin]]
name = "cce-designer"
path = "src/main.rs"

# Standalone smoke test for the ash renderer (opens its own window; does not
# touch the main app). Run inside a Wayland session:
#   cargo run -p cce-designer --bin vk-smoke
[[bin]]
name = "vk-smoke"
path = "src/vk_smoke.rs"



