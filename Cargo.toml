[package]
name = "cce-designer"
version = "0.1.0"
edition = "2021"

[dependencies]
cce-ui = { git = "https://git.lucas.co/cce-ui.git", rev = "574a573102b96de934d8e3494d15d5ab4a7201ce" }
smithay-client-toolkit = "0.19.2"
calloop = "0.13.0"
calloop-wayland-source = "0.3.0"
wayland-client = { version = "0.31", features = ["system"] }
xkeysym = "0.2"
bytemuck = { version = "1", features = ["derive"] }
# Only the vk-smoke bin shapes text directly now — the app's text goes through
# the engine's display-list pass (display_list_text) since the paint migration.
tokio = { version = "1", features = ["full"] }
glam = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
opencl3 = "0.9"
log = "0.4"
env_logger = "0.11"
png = "0.17"

[[bin]]
name = "cce-designer"
path = "src/main.rs"

# Standalone smoke test for the ash renderer (opens its own window; does not
# touch the main app). Run inside a Wayland session:
#   cargo run -p cce-designer --bin vk-smoke
[[bin]]
name = "vk-smoke"
path = "src/vk_smoke.rs"



